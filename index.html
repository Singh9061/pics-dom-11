<!doctype html>
<html lang="en">

<head>
  <!-- Character Encoding -->
  <meta charset="UTF-8" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Theme -->
  <meta name="theme-color" content="#0a0a0a" />

  <!-- SEO -->
  <title>Pics Dom | Photography Portfolio</title>

  <meta name="description"
    content="Pics Dom is a photography portfolio showcasing artistic photography, portraits, landscapes, travel, and visual storytelling." />

  <meta name="keywords" content="photography, portfolio, photographer, gallery, artist, photos, creative, Pics Dom" />

  <meta name="author" content="Pics Dom" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Pics Dom" />
  <meta property="og:description" content="A modern photography portfolio showcasing artistic visual storytelling." />
  <meta property="og:image" content="/og-image.jpg" />
  <meta property="og:url" content="https://your-domain.com" />
  <meta property="og:site_name" content="Pics Dom" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pics Dom" />
  <meta name="twitter:description" content="Photography portfolio and visual storytelling." />
  <meta name="twitter:image" content="/og-image.jpg" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Optional -->
  <meta name="format-detection" content="telephone=no" />
</head>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>

</html>
